name: Feature request
description: Propose a capability, API, or diagnostic.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Treequel is expression trees for TypeScript, with LINQ as the flagship application — **not an ORM**. Migrations,
        schema management, and relation mapping are out of scope by design. Features that fit "a tree, a provider, or a
        diagnostic" are in scope.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you express or do today? Show the code you wish worked.
      render: ts
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? If it touches the tree format or a provider's capabilities, say so.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, and why they fall short (e.g. the `.inMemory()` boundary).
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is not ORM territory (migrations / schema management / relation mapping).
          required: true
        - label: I searched existing issues and the roadmap.
          required: true
