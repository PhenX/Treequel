name: CI
on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Dependency graph
        run: node scripts/check-graph.mjs
      - name: Lint
        run: npx oxlint
      - name: Format check
        run: npx oxfmt --check .
      - name: Typecheck + build (tsc -b, topological)
        run: npx tsc -b
      - name: Type tests (F | Expr<F> inference)
        run: npx tsc --noEmit -p type-tests/tsconfig.json
      - name: Test (vitest workspace; property + conformance on PGlite)
        run: npx vitest run

  pkg-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - name: publint each public package tarball
        run: |
          for dir in packages/*/; do
            if [ -f "$dir/package.json" ] && ! grep -q '"private": true' "$dir/package.json"; then
              (cd "$dir" && npm pack --dry-run && npx --yes publint) || true
            fi
          done
